name: build-images

on:
  schedule:
    # Daily at 03:00 UTC — Wolfi is a rolling-release repo, so this picks up
    # the latest security patches automatically.
    - cron: "0 3 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "images/**"
      - ".github/workflows/build-images.yml"
      - ".github/scripts/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # queue runs instead of racing on the README push

env:
  APKO_VERSION: "1.3.0"

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      entries: ${{ steps.find.outputs.entries }}
    steps:
      - uses: actions/checkout@v4

      - id: find
        name: Discover runtime/version image variants (incl. -dev)
        run: bash .github/scripts/discover-versions.sh

  build:
    needs: discover
    if: needs.discover.outputs.entries != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.entries) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install apko
        run: bash .github/scripts/install-apko.sh

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & publish ${{ matrix.runtime }}:${{ matrix.version }}
        id: publish
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          RUNTIME: ${{ matrix.runtime }}
          VERSION: ${{ matrix.version }}
        run: bash .github/scripts/build-and-publish.sh

      - name: Scan ${{ matrix.runtime }}:${{ matrix.version }} with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: ${{ steps.publish.outputs.tar }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0" # report-only: never fails the pipeline

      - name: Upload Trivy results to the Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.runtime }}-${{ matrix.version }}

      - name: Scan ${{ matrix.runtime }}:${{ matrix.version }} for README summary
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: ${{ steps.publish.outputs.tar }}
          format: json
          output: trivy-summary.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"

      - name: Build scan summary
        env:
          RUNTIME: ${{ matrix.runtime }}
          VERSION: ${{ matrix.version }}
        run: bash .github/scripts/summarize-scan.sh

      - name: Upload scan summary
        uses: actions/upload-artifact@v4
        with:
          name: scan-summary-${{ matrix.runtime }}-${{ matrix.version }}
          path: scan-summary-${{ matrix.runtime }}-${{ matrix.version }}.json

  update-readme:
    needs: build
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all scan summaries
        uses: actions/download-artifact@v4
        with:
          pattern: scan-summary-*
          path: scan-summaries
          merge-multiple: true

      - name: Render vulnerability table
        run: bash .github/scripts/render-readme.sh

      - name: Commit updated README
        run: bash .github/scripts/commit-readme.sh
