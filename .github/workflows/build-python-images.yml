name: build-python-images

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "images/python/**"
      - ".github/workflows/build-python-images.yml"
      - ".github/scripts/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false 

env:
  APKO_VERSION: "1.3.0"

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.find.outputs.versions }}
    steps:
      - uses: actions/checkout@v4

      - id: find
        name: Discover python image variants (incl. -dev)
        run: bash .github/scripts/discover-versions.sh

  build:
    needs: discover
    if: needs.discover.outputs.versions != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read 
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.discover.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install apko
        run: bash .github/scripts/install-apko.sh

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4
    
      - name: Build & publish python:${{ matrix.version }}
        id: publish
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          VERSION: ${{ matrix.version }}
        run: bash .github/scripts/build-and-publish.sh

      - name: Sign image with cosign
        run: cosign sign --yes "${{ steps.publish.outputs.digest }}"

      - name: Scan python:${{ matrix.version }} with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: ${{ steps.publish.outputs.tar }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload Trivy results to the Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.version }}

      - name: Scan python:${{ matrix.version }} for README summary
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: ${{ steps.publish.outputs.tar }}
          format: json
          output: trivy-summary.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"

      - name: Build scan summary
        env:
          VERSION: ${{ matrix.version }}
        run: bash .github/scripts/summarize-scan.sh

      - name: Upload scan summary
        uses: actions/upload-artifact@v4
        with:
          name: scan-summary-${{ matrix.version }}
          path: scan-summary-${{ matrix.version }}.json

  cleanup-old-tags:
    needs: [discover, build]
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    env:
      KEEP: 5 
    steps:
      - uses: actions/checkout@v4

      - name: Delete old dated tags from Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VERSIONS: ${{ needs.discover.outputs.versions }}
        run: bash .github/scripts/cleanup-old-tags.sh

  update-readme:
    needs: build
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all scan summaries
        uses: actions/download-artifact@v4
        with:
          pattern: scan-summary-*
          path: scan-summaries
          merge-multiple: true

      - name: Render vulnerability table
        run: bash .github/scripts/render-readme.sh

      - name: Commit updated README
        run: bash .github/scripts/commit-readme.sh
