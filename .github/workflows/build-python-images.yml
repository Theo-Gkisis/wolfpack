name: build-python-images

on:
  schedule:
    # Daily at 03:00 UTC — Wolfi is a rolling-release repo, so this picks up
    # the latest security patches automatically.
    - cron: "0 3 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "images/python/**"
      - ".github/workflows/build-python-images.yml"

permissions:
  contents: read

env:
  APKO_VERSION: "1.3.0"

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.find.outputs.versions }}
    steps:
      - uses: actions/checkout@v4

      - id: find
        name: Discover python image variants (incl. -dev)
        run: |
          versions=$(find images/python -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Found versions: $versions"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    if: needs.discover.outputs.versions != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read # required by upload-sarif to read workflow-run info on private repos
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.discover.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install apko
        run: |
          curl -sL "https://github.com/chainguard-dev/apko/releases/download/v${APKO_VERSION}/apko_${APKO_VERSION}_linux_amd64.tar.gz" -o apko.tar.gz
          tar -xzf apko.tar.gz
          sudo mv "apko_${APKO_VERSION}_linux_amd64/apko" /usr/local/bin/apko
          apko version

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & publish python:${{ matrix.version }}
        id: publish
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          NAMESPACE_LC=$(echo "$DOCKERHUB_USERNAME" | tr '[:upper:]' '[:lower:]')
          IMAGE="docker.io/${NAMESPACE_LC}/wolfpack-python"
          DATE_TAG=$(date -u +%Y%m%d)

          apko publish \
            "images/python/${{ matrix.version }}/apko.yaml" \
            "${IMAGE}:${{ matrix.version }}" \
            "${IMAGE}:${{ matrix.version }}-${DATE_TAG}" \
            --arch x86_64

          echo "image=${IMAGE}:${{ matrix.version }}-${DATE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Scan python:${{ matrix.version }} with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.publish.outputs.image }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0" # report-only: never fails the pipeline

      - name: Upload Trivy results to the Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.version }}

      - name: Scan python:${{ matrix.version }} for README summary
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.publish.outputs.image }}
          format: json
          output: trivy-summary.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"

      - name: Build scan summary
        run: |
          counts=$(jq '[.Results[]?.Vulnerabilities[]?.Severity] | group_by(.) | map({(.[0]): length}) | add // {}' trivy-summary.json)

          jq -n \
            --arg version "${{ matrix.version }}" \
            --arg scanned_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson counts "$counts" \
            '{
              version: $version,
              scanned_at: $scanned_at,
              critical: ($counts["CRITICAL"] // 0),
              high: ($counts["HIGH"] // 0),
              medium: ($counts["MEDIUM"] // 0),
              low: ($counts["LOW"] // 0),
              unknown: ($counts["UNKNOWN"] // 0)
            }' > "scan-summary-${{ matrix.version }}.json"

      - name: Upload scan summary
        uses: actions/upload-artifact@v4
        with:
          name: scan-summary-${{ matrix.version }}
          path: scan-summary-${{ matrix.version }}.json

  update-readme:
    needs: build
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all scan summaries
        uses: actions/download-artifact@v4
        with:
          pattern: scan-summary-*
          path: scan-summaries
          merge-multiple: true

      - name: Render vulnerability table
        run: |
          {
            echo "| Image tag | Critical | High | Medium | Low | Unknown | Total | Last scanned (UTC) |"
            echo "|---|---|---|---|---|---|---|---|"
            for f in $(ls scan-summaries/*.json | sort -V); do
              jq -r '"| \(.version) | \(.critical) | \(.high) | \(.medium) | \(.low) | \(.unknown) | \(.critical+.high+.medium+.low+.unknown) | \(.scanned_at) |"' "$f"
            done
          } > table.md

          awk '
            /<!-- TRIVY-TABLE:START -->/{print; while ((getline line < "table.md") > 0) print line; skip=1; next}
            /<!-- TRIVY-TABLE:END -->/{skip=0}
            !skip
          ' README.md > README.md.new
          mv README.md.new README.md

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update vulnerability scan summary"
          git push origin HEAD:main
