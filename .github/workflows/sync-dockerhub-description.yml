name: sync-dockerhub-description

on:
  push:
    branches: [main]
    paths:
      - "docker-hub/**"
      - ".github/workflows/sync-dockerhub-description.yml"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - runtime: python
            short-description: "🐺 Hardened Wolfi/apko Python images  — no shell/pip in production, daily rebuilds."
          - runtime: node
            short-description: "🐺 Hardened Wolfi/apko Node.js images  — no shell/npm in production, daily rebuilds."
          - runtime: java
            short-description: "🐺 Hardened Wolfi/apko Java images  — no shell/JDK in production, daily rebuilds."
          - runtime: dotnet
            short-description: "🐺 Hardened Wolfi/apko .NET images — no shell/SDK in production, daily rebuilds."
    steps:
      - uses: actions/checkout@v4

      - name: Push description to Docker Hub
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: teogisis/wolfpack-${{ matrix.runtime }}
          short-description: ${{ matrix.short-description }}
          readme-filepath: ./docker-hub/${{ matrix.runtime }}.md
