name: sync-dockerhub-description

on:
  push:
    branches: [main]
    paths:
      - "DOCKERHUB.md"
      - ".github/workflows/sync-dockerhub-description.yml"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push description to Docker Hub
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: teogisis/wolfpack-python
          short-description: "🐺 Hardened Wolfi/apko Python images (3.10-3.14) — no shell/pip in production, daily rebuilds."
          readme-filepath: ./DOCKERHUB.md
