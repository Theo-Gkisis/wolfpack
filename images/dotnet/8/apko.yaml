contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - dotnet-8-runtime

environment:
  DOTNET_RUNNING_IN_CONTAINER: "true"
  ASPNETCORE_HTTP_PORTS: "8080"

entrypoint:
  command: /usr/bin/dotnet

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
  run-as: 65532

archs:
  - x86_64
