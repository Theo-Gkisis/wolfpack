contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - openjdk-17-jre-base
    - openjdk-17-default-jvm

environment:
  JAVA_HOME: /usr/lib/jvm/default-jvm
  LANG: en_US.UTF-8

entrypoint:
  command: /usr/bin/java

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
  run-as: 65532

archs:
  - x86_64
