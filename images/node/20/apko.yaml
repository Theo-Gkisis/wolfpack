contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - nodejs-20-minimal

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
  run-as: 65532

environment:
  NPM_CONFIG_UPDATE_NOTIFIER: "false"
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

work-dir: /app

entrypoint:
  command: /usr/bin/node

cmd: --help

archs:
  - x86_64
